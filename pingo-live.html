<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Pingo Live - 실시간 안심 귀가 & 가족 위치</title>
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.1.2/mapbox-gl.css" rel="stylesheet" />
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.1.2/mapbox-gl.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #0F172A; color: #fff; }
    #map { position: absolute; inset: 0; width: 100%; height: 100%; }
    .top-banner {
      position: absolute; top: 16px; left: 16px; right: 16px; z-index: 10;
      background: rgba(15, 23, 42, 0.92); backdrop-filter: blur(12px);
      border-radius: 20px; padding: 14px 18px; border: 1px solid rgba(108, 71, 255, 0.4);
      box-shadow: 0 10px 30px rgba(0,0,0,0.45); display: flex; align-items: center; justify-content: space-between;
    }
    .brand { display: flex; align-items: center; gap: 10px; }
    .pulse-dot { width: 12px; height: 12px; border-radius: 50%; background: #12B76A; box-shadow: 0 0 0 0 rgba(18, 183, 106, 0.7); animation: pulse 1.6s infinite; }
    @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(18, 183, 106, 0.7); } 70% { box-shadow: 0 0 0 12px rgba(18, 183, 106, 0); } 100% { box-shadow: 0 0 0 0 rgba(18, 183, 106, 0); } }
    .bottom-card {
      position: absolute; bottom: 20px; left: 16px; right: 16px; z-index: 10;
      background: #FFFFFF; color: #101828; border-radius: 24px; padding: 20px;
      box-shadow: 0 12px 36px rgba(0,0,0,0.28); max-width: 500px; margin: 0 auto;
    }
    .badge-row { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
    .badge { padding: 6px 12px; border-radius: 999px; font-size: 13px; font-weight: 700; background: #F2F4F7; color: #344054; }
    .badge.green { background: #E8F8F0; color: #027A48; }
    .badge.purple { background: #F4F0FF; color: #6C47FF; }
    .badge.red { background: #FEF3F2; color: #B42318; }
    .cta-btn {
      display: block; width: 100%; margin-top: 14px; padding: 14px; border-radius: 14px;
      background: #6C47FF; color: #fff; text-align: center; text-decoration: none; font-weight: 800; font-size: 15px;
    }
    .pin-marker {
      width: 46px; height: 46px; border-radius: 50%; background: #6C47FF; border: 3px solid #fff;
      display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 900;
      box-shadow: 0 6px 18px rgba(108,71,255,0.55); font-size: 16px;
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <div class="top-banner">
    <div class="brand">
      <div class="pulse-dot" id="liveDot"></div>
      <div>
        <div style="font-size:15px; font-weight:800;" id="headerTitle">Pingo 실시간 안심 귀가 공유</div>
        <div style="font-size:12px; color:#94A3B8;" id="lastSyncText">실시간 위성 좌표 수신 중...</div>
      </div>
    </div>
    <div style="font-size:12px; font-weight:800; color:#A78BFA;" id="circleCodeBadge">LIVE</div>
  </div>

  <div class="bottom-card">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <div>
        <div style="font-size:18px; font-weight:900;" id="userNameText">위치 연결 중...</div>
        <div style="font-size:13px; color:#667085; margin-top:2px;" id="coordText">잠시만 기다려 주세요</div>
      </div>
    </div>
    <div class="badge-row">
      <span class="badge green" id="batteryBadge">🔋 배터리 --%</span>
      <span class="badge purple" id="speedBadge">🚶 0 km/h</span>
      <span class="badge" id="statusBadge">안전 이동 중</span>
    </div>
    <a class="cta-btn" id="openMapBtn" href="https://jeong-giseong.github.io" target="_blank">📍 Pingo 앱에서 양방향 위치 공유하기</a>
  </div>

  <script>
    const SUPABASE_URL = "https://wgonnoaoputcwuewhnzl.supabase.co";
    const SUPABASE_KEY = "sb_publishable_TmbmuSQBaJ6ScfcOEKRbEQ_i7Lh76KH";
    mapboxgl.accessToken = ["pk.eyJ1IjoiamVvbmdnaXNlb25n", "IiwiYSI6ImNtdnFhNHhpMDA2OHoyeXIwZThuMnkwanYifQ", "._Zouj-a9d2NaLWCVyRKwiQ"].join("");

    const params = new URLSearchParams(window.location.search);
    const circleCode = params.get("circle") || params.get("code") || "";
    const uid = params.get("uid") || "";
    const initLat = parseFloat(params.get("lat") || "37.5665");
    const initLng = parseFloat(params.get("lng") || "126.9780");

    if (circleCode) {
      document.getElementById("circleCodeBadge").innerText = "코드: " + circleCode;
    }

    const map = new mapboxgl.Map({
      container: "map",
      style: "mapbox://styles/mapbox/streets-v12",
      center: [initLng, initLat],
      zoom: 15.5
    });

    const el = document.createElement("div");
    el.className = "pin-marker";
    el.innerText = "📍";
    const marker = new mapboxgl.Marker(el).setLngLat([initLng, initLat]).addTo(map);

    async function pollRealtimeLocation() {
      try {
        let queryUrl = `${SUPABASE_URL}/rest/v1/locations?select=*&order=updated_at.desc&limit=1`;
        if (uid) {
          queryUrl = `${SUPABASE_URL}/rest/v1/locations?user_id=eq.${encodeURIComponent(uid)}&select=*&limit=1`;
        } else if (circleCode) {
          queryUrl = `${SUPABASE_URL}/rest/v1/locations?circle_code=eq.${encodeURIComponent(circleCode)}&select=*&order=updated_at.desc&limit=1`;
        }
        const res = await fetch(queryUrl, {
          headers: { "apikey": SUPABASE_KEY, "Authorization": `Bearer ${SUPABASE_KEY}` }
        });
        if (!res.ok) return;
        const rows = await res.json();
        if (!rows || rows.length === 0) return;

        const row = rows[0];
        const lat = parseFloat(row.lat);
        const lng = parseFloat(row.lng);
        const spd = parseFloat(row.speed_kmh || 0);
        const bat = parseInt(row.battery_level || 90);
        const name = row.user_name || "가족 멤버";
        const isSos = row.is_sos === true;

        marker.setLngLat([lng, lat]);
        map.easeTo({ center: [lng, lat], duration: 1200 });

        document.getElementById("userNameText").innerText = name + "님의 실시간 위치";
        document.getElementById("coordText").innerText = `위도 ${lat.toFixed(5)}, 경도 ${lng.toFixed(5)}`;
        document.getElementById("batteryBadge").innerText = `🔋 배터리 ${bat}%`;
        document.getElementById("speedBadge").innerText = spd >= 4 ? `🚗 이동 중 (${spd.toFixed(0)} km/h)` : `🚶 정지/도보 (${spd.toFixed(0)} km/h)`;

        const stBadge = document.getElementById("statusBadge");
        if (isSos) {
          stBadge.className = "badge red";
          stBadge.innerText = "🚨 SOS 위급 신호 발령 중!";
          document.getElementById("liveDot").style.background = "#F04438";
        } else {
          stBadge.className = "badge green";
          stBadge.innerText = "✅ 실시간 보호 활성";
        }
        document.getElementById("lastSyncText").innerText = "방금 업데이트됨 (" + new Date().toLocaleTimeString() + ")";
      } catch (e) {}
    }

    pollRealtimeLocation();
    setInterval(pollRealtimeLocation, 4000);
  </script>
</body>
</html>
